syntax = "proto3";

package edu.gandhi.model.proto;

//well known types https://protobuf.dev/reference/protobuf/google.protobuf/#index
import "google/protobuf/timestamp.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/empty.proto";

//check different options here https://github.com/protocolbuffers/protobuf/blob/main/src/google/protobuf/descriptor.proto
option java_package = "edu.gandhi.model.proto";
option java_multiple_files = true;

//find style guide and conventions: https://protobuf.dev/programming-guides/style/
enum RainbowColor{
  UNDEFINED = 0;
  RED = 1;
  ORANGE = 2;
  YELLOW = 3;
  GREEN = 4;
  BLUE = 5;
  INDIGO = 6;
  VIOLET = 7;
}

message Person{
  string name = 1;
  repeated string unique_identifier = 2;
  map<string, RainbowColor> colorMap = 3;
  reserved "email", "first_name", "last_name";
  reserved 4, 5 to 6 ; // tag for email was 4, first_name 5, last_name 6
  google.protobuf.Timestamp last_seen = 7;
}

service ExampleService{
  rpc ListExamples(google.protobuf.Empty) returns (Person);
}